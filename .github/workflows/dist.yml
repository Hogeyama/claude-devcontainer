name: dist

# Consumers vendor .devcontainer/claude from the dist branch with git subtree.
on:
  push:
    branches: [main]

concurrency: dist

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/build-dist.sh main dist
      # The rebuild reproduces earlier dist commits, so this is a fast-forward;
      # a rejected push means dist was changed by hand.
      - run: git push origin dist

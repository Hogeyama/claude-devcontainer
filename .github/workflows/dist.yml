name: dist

# Consumers vendor .devcontainer/claude from the dist branch with git subtree.
on:
  push:
    branches: [main]

concurrency: dist

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/build-dist.sh main origin/dist
      # dist is only extended, so this is a fast-forward even when main was
      # force-pushed; a rejected push means dist was changed elsewhere.
      - run: git push origin dist

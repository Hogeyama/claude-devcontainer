services:
  native:
    image: ${AGENT_IMAGE:-claude-devcontainer_devcontainer-agent:latest}
    user: "1000:1000"
    entrypoint: ["/server/bin/code-server", "--host", "0.0.0.0", "--port", "8002", "--connection-token", "demo-native-token", "--accept-server-license-terms", "--server-data-dir", "/tmp/native-data", "--extensions-dir", "/tmp/native-extensions", "--disable-telemetry"]
    environment:
      HOME: /tmp/home
    volumes:
      - ${NATIVE_SERVER_DIR:?Set NATIVE_SERVER_DIR to the extracted official server}:/server:ro
      - ./workspace:/workspace
      - .:/demo:ro
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      backend:
        aliases: [native.localhost]
  proxy:
    environment:
      DEMO_NATIVE: '1'
    command: ["--ignore-hosts", "^native\\.localhost:8002$"]

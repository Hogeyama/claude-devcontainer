# This file is pnpm's per-project configuration (packages may be omitted for a
# single project).
# The agent's node_modules is the host's, shared copy-on-write, and `pnpm
# install` inside the agent cannot reach a registry. The default `install`/
# `prompt` behavior tries to reinstall before running a script and fails
# there; `warn` keeps the up-to-date check on the host but never modifies the
# shared modules.
verifyDepsBeforeRun: warn
# Optional helpers of dockerode (a testcontainers dependency). The SSH/native
# pieces are unused against DinD, so their build scripts stay off — explicitly,
# so that `pnpm install` does not flag them as ignored.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false

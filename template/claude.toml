# Settings of this workspace's container, committed with it. Every setting may
# be left out; the values shown commented out are the defaults or examples.
# User defaults go in ~/.config/claude-devcontainer/claude.toml (or under
# XDG_CONFIG_HOME). Precedence: defaults < global < workspace < local.
#
# Settings for one host only (UID, networks, connectors, paths, hosts only some
# users need) go in claude.local.toml next to this file, in the same form and
# not committed. Its tables merge into these key by key; other values, lists
# included, replace these, and each of its proxy.hosts replaces the same host
# here as a whole.
#
# After a change, stop the environment and run `devcontainer up` again; for
# git.*, agent.*, acp.*, docker.enabled, nix.enabled, sumi.enabled, codeServer.*, with
# --remove-existing-container. Relative paths are from this directory (except
# git.shared_hidden_paths, from the repository root), and ~ is the host's home.

[git]
# "clone": independent workspace volume (default).
# "shared": edit the host's working tree with the agent's own .git in a
# volume; the host's .git is read-only at /run/host/git. The agent commits
# there, and the host reviews with `git fetch agent` and moves HEAD and the
# index with `git reset --mixed COMMIT`.
# "unsafe_shared": share the host index, refs and objects too; protect Git
# configuration/hooks and .devcontainer. Commits immediately affect the host.
# Use clone to develop .devcontainer. Recreate the container after changing it.
# isolation = "clone"
# Existing files/directories to hide in shared mode, relative to the repository
# root. Default: [] (no paths). In-repository sumi.secrets is also hidden.
# Set these paths in claude.local.toml. Recreate after changing this.
# shared_hidden_paths = [".env", "private/credentials"]
# Give the agent the host's remotes (clone and shared) whose host is in
# proxy.hosts, as HTTPS without credentials (SSH ones converted), for fetch:
# the proxy carries no push. Added at each start unless the name is there.
# inherit_remotes = true

[agent]
# Directories prepended to Bash's PATH in this order. ~ and symlinks are
# resolved on the host at `devcontainer up`; no files are copied or mounted.
# Nix profile paths need nix.enabled = true. Usually set this globally.
# extra_path = ["~/.nix-profile/bin"]
# Owner of the agent's volumes; match the host UID/GID for dependency overlays.
# uid = 1000
# gid = 1000
# Environment variables of the agent, merged by name with the global and local
# files. Values are literal ($ is not expanded) and readable by the agent, so
# no secrets; the proxy injects those (proxy.hosts).
# env = { GRADLE_OPTS = "-Dorg.gradle.daemon=false" }
# Host paths to bind into the agent, as SOURCE:TARGET[:ro|rw|cow], read-only
# unless given. :cow, for a directory, is copy-on-write: the agent writes to an
# upper directory of this workspace under ~/.local/state/claude-devcontainer/cow,
# never to the source; do not change the source while the agent runs. The source
# must exist; ~ and relative paths resolve like the other paths. A target of
# ~/... is under the agent's home, /home/node. Targets that the environment
# manages (/workspace, /run, ~/.claude, ...) are refused. Mind what the agent
# can read, or with :rw, change on the host.
# mounts = ["~/.m2/repository:~/.m2/repository:cow", "~/data:/mnt/data:rw"]
# Share Claude Code's session history of this repository with the host's
# (~/.claude/projects/<path>), read-write, so that either resumes the other's
# sessions. Unsafe: the agent can then write a session that the host's Claude,
# without the container's limits, resumes.
# share_projects = false

[acp]
# Install claude-agent-acp for host ACP clients (agent-shell, Avante, etc.),
# which connect through scripts/acp-agent.py. Needs git.isolation = "shared" or "unsafe_shared":
# the client's files are then the agent's. Changes need an image rebuild.
# enabled = false
# Exact package version; tags such as "latest" and ranges are not accepted.
# version = "0.90.0"

[docker]
# Run Docker in DinD for the agent.
# enabled = false
# Images to load into DinD, as name:tag. The host pulls the ones it lacks on
# `devcontainer up` and copies them in; DinD cannot reach a registry.
# Testcontainers also needs the Ryuk image of the version your library uses.
# images = ["testcontainers/ryuk:0.14.0", "postgres:16"]
# A base of DinD's data shared by the workspaces that name it, which run at
# once, each copy-on-write over it. scripts/dind-base.py loads images into it,
# with every DinD over it stopped; they need the same agent.uid. Empty: none.
# Ignored while enabled is false, so the global claude.toml can set it.
# shared_base = ""

[nix]
# Mount the host's /nix/store and load the flake's dev shell, evaluated at a
# commit on the host.
# enabled = false
# ref = "HEAD"
# shell = "devShells.x86_64-linux.foo"   # default: the default dev shell

[sumi]
# Mask the values in a secrets file, one per line with mode 0600, in what
# Claude's tools return.
# enabled = false
# secrets = "~/.config/claude-devcontainer/sumi/secrets.txt"

[proxy]
# A host PEM file of CA certificates, such as an in-house root under /etc, that
# the proxy trusts for upstream TLS besides the public roots.
# ca = "/etc/ssl/certs/company-root.pem"
# IDs of the claude.ai connectors that Claude may use. They are per account, so
# they usually go in claude.local.toml.
# connectors = ["mcpsrv_01AbCdEf"]
# Allow Claude Code's server-side WebSearch. Search traffic from Anthropic is
# outside proxy.hosts; this also allows API calls made from Bash. Restart the
# environment after changing it. See "WebSearchを使う" in docs/network-policy.md.
# web_search = false

# What the proxy lets through besides Anthropic, by host. The host bakes it
# into the proxy image on every `devcontainer up`. See "通信ルールを変更する" in
# docs/network-policy.md of claude-devcontainer. Quote host names, which
# contain dots.
#
#   routes: the requests to let through, as "METHOD path" or a bare path (any
#     method). The path is a regular expression for the whole URL path,
#     without the query.
#   headers: request headers the agent may send, besides common ones (Accept,
#     Content-Type, User-Agent, ...). Credentials cannot be passed.
#   inject: headers the proxy adds, replacing the agent's. ${NAME} is a secret
#     assigned in ~/.config/claude-devcontainer/credentials on the host; only
#     the ones named here are sent. { basic = "user:password" } makes Basic
#     authentication.
#   http: true lets routes through over plain HTTP on port 80 too, besides
#     HTTPS on 443. Such a host cannot have inject: secrets would cross the
#     network in the clear.
#   env: environment variables that the agent gets as the dummy
#     "managed-by-proxy", so that tools send requests at all; the proxy
#     replaces the credential.

# GitHub, with GITHUB_TOKEN a read-only fine-grained PAT limited to the
# repositories to share: REST for those repositories, GraphQL, and Git fetch
# over HTTPS.
[proxy.hosts."api.github.com"]
routes = ["POST /graphql", "GET /user", '/repos/[^/]+/[^/]+(/.*)?']
headers = ["X-GitHub-Api-Version"]
inject = { Authorization = { basic = "x-access-token:${GITHUB_TOKEN}" } }
env = ["GH_TOKEN"]

[proxy.hosts."github.com"]
# Fetch only: without git-receive-pack, the agent cannot push past the
# host's review, whatever the token allows.
routes = ['/[^/]+/[^/]+\.git/(info/refs|git-upload-pack)']
headers = ["Git-Protocol"]
inject = { Authorization = { basic = "x-access-token:${GITHUB_TOKEN}" } }

# A public host, such as the fonts a page loads:
# [proxy.hosts."fonts.googleapis.com"]
# routes = ["GET /css2?"]

# A host served over plain HTTP, such as an in-house mirror:
# [proxy.hosts."mirror.my-company.com"]
# routes = ["GET /debian/.+"]
# http = true

# An API with a token. An inline table must fit on one line; with more than
# one header, write inject as its own table:
# [proxy.hosts."api.notion.com"]
# routes = ["/v1/.+"]
# headers = ["Notion-Version"]
# env = ["NOTION_API_KEY"]
# [proxy.hosts."api.notion.com".inject]
# Authorization = "Bearer ${NOTION_API_KEY}"

[subnets]
# The first three octets of the two internal /24 networks. Unset, `devcontainer
# up` picks a free pair in 10.231.x and keeps it.
# proxy = "10.231.70"
# dind = "10.231.71"

[codeServer]
# An editor on the host for the agent's workspace, with the host's IME and
# without the host's VS Code paths into the container: the agent's VS Code
# (Coder code-server) in a dedicated Electron window that reaches nothing but
# the agent, on Windows + WSL and on Linux (Wayland or X11).
# Rebuild after changing this setting,
# then open with claude/scripts/code-server.sh; no administrator rights.
# See claude/code-server/README.md.
enabled = false
# Marketplace IDs, optionally @version,
# installed into the agent's image at build time (rebuild and recreate the
# agent after a change). anthropic.claude-code is always installed.
extensions = [] # e.g. ["ms-python.python"]

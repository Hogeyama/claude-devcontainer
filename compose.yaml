# Distributed core. Include it from .devcontainer/compose.yaml and extend there;
# paths here assume this directory is .devcontainer/claude in the workspace.
#
# Settings, read from the environment of `devcontainer up`, else from
# .devcontainer/.env (this host's), else from .devcontainer/claude.env (the
# workspace's; see template/compose.yaml):
#   CLAUDE_DEVCONTAINER_UID, CLAUDE_DEVCONTAINER_GID  the agent's user; it must be
#     able to write the workspace on the host. Default 1000.
#   CLAUDE_DEVCONTAINER_PROXY_NET, CLAUDE_DEVCONTAINER_DIND_NET  the first three
#     octets of the two internal /24 networks. Default 10.231.70 and 10.231.71.
#   CLAUDE_DEVCONTAINER_DIND=1  run Docker in DinD for the agent. Default 0.
#   CLAUDE_DEVCONTAINER_NIX=1  mount the host's /nix/store and load the dev shell
#     that initializeCommand exports (see scripts/initialize.sh). Default 0.
#   CLAUDE_DEVCONTAINER_SUMI=1  mask the values in a secrets file in what
#     Claude's tools return. Default 0.
#   CLAUDE_DEVCONTAINER_SUMI_DIR, CLAUDE_DEVCONTAINER_SUMI_FILE  the host
#     directory holding the secrets file, and its name in it. Default
#     ~/.claude/sumi and secrets.txt. Relative directories are based here,
#     at .devcontainer/claude/.
# Features are 0 or 1: compose can neither add a service nor a mount
# conditionally, so the values select a scale and a path instead.
services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      # The workspace's .devcontainer/, for its optional agent-setup.sh.
      additional_contexts:
        workspace-config: ..
      args:
        AGENT_UID: ${CLAUDE_DEVCONTAINER_UID:-1000}
        AGENT_GID: ${CLAUDE_DEVCONTAINER_GID:-1000}
    command: ["sleep", "infinity"]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges=true
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    environment:
      # The entrypoint's firewall allows only these two.
      CLAUDE_DEVCONTAINER_PROXY_ADDRESS: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.10
      CLAUDE_DEVCONTAINER_DIND_ADDRESS: ${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.10
      HTTP_PROXY: http://${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.10:8080
      HTTPS_PROXY: http://${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.10:8080
      http_proxy: http://${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.10:8080
      https_proxy: http://${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.10:8080
      NO_PROXY: localhost,127.0.0.1,::1,${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.10
      no_proxy: localhost,127.0.0.1,::1,${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.10
      DOCKER_HOST: tcp://127.0.0.1:2375
      TESTCONTAINERS_HOST_OVERRIDE: 127.0.0.1
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /run/user/${CLAUDE_DEVCONTAINER_UID:-1000}/docker.sock
      CLAUDE_DEVCONTAINER_DIND: ${CLAUDE_DEVCONTAINER_DIND:-0}
      CLAUDE_DEVCONTAINER_NIX: ${CLAUDE_DEVCONTAINER_NIX:-0}
      CLAUDE_DEVCONTAINER_SUMI: ${CLAUDE_DEVCONTAINER_SUMI:-0}
      # Dummies that the proxy replaces with the real credentials. Claude takes
      # an OAuth token, not an API key, so that it counts as a claude.ai login
      # and offers Artifacts.
      GH_TOKEN: managed-by-proxy
      CLAUDE_CODE_OAUTH_TOKEN: managed-by-proxy
    volumes:
      - ../..:/workspace
      # The host builds and runs what is here (compose files, the proxy's
      # policy, initializeCommand, credential injection), so the agent must
      # not change it.
      - ..:/workspace/.devcontainer:ro
      # Git on the host runs what these name (hooks, core.fsmonitor, filters,
      # ...). .git is its own mount so that it cannot be replaced. Writing the
      # config fails, so the image disables automatic upstream tracking.
      - {type: bind, source: ../../.git, target: /workspace/.git, bind: {create_host_path: false}}
      - {type: bind, source: ../../.git/config, target: /workspace/.git/config, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ../../.git/hooks, target: /workspace/.git/hooks, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ../../.git/modules, target: /workspace/.git/modules, read_only: true, bind: {create_host_path: false}}
      - public-ca:/public-ca:ro
      - dind-run:/var/run/dind:ro
      # Read-only, so that the agent cannot swap the broker's socket for its own.
      - sumi-run:/run/sumi:ro
      # Session history, kept across container rebuilds for `claude --resume`.
      - claude-projects:/home/node/.claude/projects
      # features/nix-1 links to /nix/store; features/nix-0 is empty.
      - type: bind
        source: ./features/nix-${CLAUDE_DEVCONTAINER_NIX:-0}
        target: /nix/store
        read_only: true
        bind: {create_host_path: false}
    # Markers of the host's startup work, which wait-ready.sh waits for. A
    # restart clears them, so a stale one cannot end the wait early.
    tmpfs:
      - /run/claude-devcontainer:uid=${CLAUDE_DEVCONTAINER_UID:-1000},gid=${CLAUDE_DEVCONTAINER_GID:-1000},mode=0700,size=1m
      # Root's, and sticky like /tmp: Claude Code creates and replaces its own
      # files here, but cannot change or move the root-owned copies of the
      # host's configuration (scripts/copy-host-config.py). Being a mount
      # point, it cannot be moved aside as a whole either.
      - /home/node/.claude:mode=1777
    networks:
      proxy-internal:
        ipv4_address: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.20
      dind-internal:
        ipv4_address: ${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.20
    depends_on:
      proxy:
        condition: service_healthy
      dind:
        condition: service_started
        # Absent unless CLAUDE_DEVCONTAINER_DIND=1.
        required: false
      sumi:
        condition: service_started
        # Absent unless CLAUDE_DEVCONTAINER_SUMI=1.
        required: false
  proxy:
    build:
      context: proxy
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    tmpfs:
      - /run/proxy-credentials:uid=1000,gid=1000,mode=0700,size=1m
    volumes:
      - proxy-private-ca:/home/mitmproxy/.mitmproxy
      - public-ca:/public-ca
    networks:
      proxy-internal:
        ipv4_address: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.10
      proxy-external: {}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
  dind:
    scale: ${CLAUDE_DEVCONTAINER_DIND:-0}
    build:
      context: dind
      args:
        ROOTLESS_UID: ${CLAUDE_DEVCONTAINER_UID:-1000}
        ROOTLESS_GID: ${CLAUDE_DEVCONTAINER_GID:-1000}
    privileged: true
    # Nothing in DinD needs to reach out. As root, allow only loopback and
    # replies, which also keeps nested containers off the host through the
    # network gateway; then run rootless dockerd as the agent's UID.
    user: "0:0"
    entrypoint:
      - sh
      - -euc
      - |
        ip6tables -P OUTPUT DROP
        ip6tables -A OUTPUT -o lo -j ACCEPT
        iptables -P OUTPUT DROP
        # Docker's embedded resolver forwards to the host's resolver.
        iptables -A OUTPUT -d 127.0.0.11 -j DROP
        iptables -A OUTPUT -o lo -j ACCEPT
        iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        # The image's setpriv is BusyBox's, which cannot change user; su also sets HOME.
        exec su -s /bin/sh -c 'exec dockerd-entrypoint.sh dockerd --host=unix:///run/user/${CLAUDE_DEVCONTAINER_UID:-1000}/docker.sock' rootless
    environment:
      DOCKER_TLS_CERTDIR: ""
      # rootlesskit, not tini, is PID 1, so tini must register as a subreaper.
      TINI_SUBREAPER: "1"
    volumes:
      - dind-run:/run/user/${CLAUDE_DEVCONTAINER_UID:-1000}
      - dind-data:/home/rootless/.local/share/docker
    networks:
      dind-internal:
        ipv4_address: ${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.10

  # The mask broker. It alone reads the secrets; the agent's hooks and Bash ask
  # it through the socket (agent/Dockerfile writes those hooks).
  sumi:
    scale: ${CLAUDE_DEVCONTAINER_SUMI:-0}
    build:
      context: .
      dockerfile: agent/Dockerfile
      target: sumi-serve
      additional_contexts:
        workspace-config: ..
    # The owner of the secrets file, which must be 0600; and of the socket,
    # which the agent connects to.
    user: ${CLAUDE_DEVCONTAINER_UID:-1000}:${CLAUDE_DEVCONTAINER_GID:-1000}
    command: [--secrets-file, "/secrets/${CLAUDE_DEVCONTAINER_SUMI_FILE:-secrets.txt}", --listen, /run/sumi/mask.sock]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    volumes:
      # The directory, not the file: an editor that replaces the file on save
      # would leave a file mount on the old content.
      - type: bind
        source: ${CLAUDE_DEVCONTAINER_SUMI_DIR:-${HOME}/.claude/sumi}
        target: /secrets
        read_only: true
        bind: {create_host_path: false}
      - sumi-run:/run/sumi

networks:
  # Internal networks still give the host an address on each bridge. The agent
  # and DinD firewalls, not the network, keep containers off the host.
  proxy-internal:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.0/24
  dind-internal:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.0/24
  proxy-external:
    enable_ipv6: false

volumes:
  claude-projects:
  public-ca:
  proxy-private-ca:
  dind-data:
  dind-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=${CLAUDE_DEVCONTAINER_UID:-1000},gid=${CLAUDE_DEVCONTAINER_GID:-1000},mode=0700
  sumi-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=${CLAUDE_DEVCONTAINER_UID:-1000},gid=${CLAUDE_DEVCONTAINER_GID:-1000},mode=0700

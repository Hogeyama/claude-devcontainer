# This repository's own settings; see claude/template/claude.toml for all of them.

[git]
# The agent edits this checkout in place and commits to its own .git; the host
# reviews with `git fetch agent` and takes a commit with
# `git reset --mixed COMMIT`. .devcontainer is
# read-only in the container, so switch to "clone" to develop claude/ itself.
isolation = "clone"

[docker]
enabled = true
# Images needed by this repository's offline Docker probes and the demo app
# stack (demos/compose.yaml): postgres for the backend and the
# Testcontainers tests, a JRE and nginx for the compose-built images.
images = ["busybox:1.37", "testcontainers/ryuk:0.14.0", "postgres:16-alpine", "eclipse-temurin:17-jre-alpine", "nginx:1.27-alpine"]

[nix]
enabled = true

[sumi]
enabled = true
# Public demo fixture included in the clone; keep real secret lists outside Git.
secrets = "../.secrets/sumi/secrets.txt"

[codeServer]
enabled = true

# GitHub, with GITHUB_TOKEN a fine-grained PAT limited to the repositories to
# share: REST for those repositories, GraphQL, and Git over HTTPS.
[proxy.hosts."api.github.com"]
routes = ["POST /graphql", "GET /user", '/repos/[^/]+/[^/]+(/.*)?']
headers = ["X-GitHub-Api-Version"]
inject = { Authorization = { basic = "x-access-token:${GITHUB_TOKEN}" } }
env = ["GH_TOKEN"]

[proxy.hosts."github.com"]
# Fetch only: without git-receive-pack, the agent cannot push past the
# host's review, whatever the token allows.
routes = ['/[^/]+/[^/]+\.git/(info/refs|git-upload-pack)']
headers = ["Git-Protocol"]
inject = { Authorization = { basic = "x-access-token:${GITHUB_TOKEN}" } }

# Owned by this workspace. The core in claude/ is updated with git subtree;
# extend it here instead of editing it. Relative paths below are from
# .devcontainer/.
include:
  - path: claude/compose.yaml
    # The workspace's settings. .env, if present, overrides them for this host.
    env_file: [claude.env]

services:
  agent:
    # The host keeps sumi's list inside this repository. Hide it from the
    # workspace mount; only the sumi service receives the real directory.
    volumes:
      - type: tmpfs
        target: /workspace/.secrets
        read_only: true
        tmpfs:
          size: 65536
          mode: 0700

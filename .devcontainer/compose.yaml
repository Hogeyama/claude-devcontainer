# Owned by this workspace. The core in claude/ is updated with git subtree;
# extend it here instead of editing it. Relative paths below are from
# .devcontainer/.
include:
  - path: claude/compose.yaml
    # Written by initializeCommand from claude.toml and claude.local.toml;
    # settings.env wins over the subnets chosen in networks.env.
    env_file: [.generated/networks.env, .generated/settings.env]

services:
  agent:
    volumes:
      # The host's Gradle home, copy-on-write: Gradle in the agent runs
      # offline from the host's distributions and dependencies, and what it
      # writes stays in the upper directory instead of reaching the host.
      - gradle-home:/home/node/.gradle
      # Same overlay scheme for the frontend's node_modules (see docs/usage.md
      # "依存の共有と更新"). The lower is this repository's own
      # frontend/node_modules, whose absolute path prepare-deps.sh writes to
      # .env for interpolation.
      - type: volume
        source: frontend-node-modules
        target: /workspace/frontend/node_modules
        volume: {nocopy: true}

volumes:
  # initializeCommand (devcontainer.json) creates the directories. The options
  # are fixed when Docker first creates the volume; after changing them, remove
  # only gradle-home after stopping/removing its containers. Do not
  # run Gradle on the host while the agent runs: overlayfs leaves changes to the
  # lower directory under a mount undefined.
  gradle-home:
    driver_opts:
      type: overlay
      device: overlay
      o: lowerdir=${HOME}/.gradle,upperdir=${HOME}/.local/state/claude-devcontainer/gradle-home/upper,workdir=${HOME}/.local/state/claude-devcontainer/gradle-home/work
  frontend-node-modules:
    driver_opts:
      type: overlay
      device: overlay
      o: lowerdir=${DEMO_FRONTEND_NODE_MODULES},upperdir=${HOME}/.local/state/claude-devcontainer/frontend-node-modules/upper,workdir=${HOME}/.local/state/claude-devcontainer/frontend-node-modules/work

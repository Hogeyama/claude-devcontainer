# Distributed core. Include it from .devcontainer/compose.yaml and extend there;
# paths here assume this directory is .devcontainer/claude in the workspace.
services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      # The workspace's .devcontainer/, for its optional agent-setup.sh.
      additional_contexts:
        workspace-config: ..
    command: ["sleep", "infinity"]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN, DAC_OVERRIDE]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - no-new-privileges=true
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    environment:
      HTTP_PROXY: http://10.231.70.10:8080
      HTTPS_PROXY: http://10.231.70.10:8080
      http_proxy: http://10.231.70.10:8080
      https_proxy: http://10.231.70.10:8080
      NO_PROXY: localhost,127.0.0.1,::1,10.231.71.10
      no_proxy: localhost,127.0.0.1,::1,10.231.71.10
      DOCKER_HOST: tcp://127.0.0.1:2375
      TESTCONTAINERS_HOST_OVERRIDE: 127.0.0.1
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /run/user/1000/docker.sock
      CLAUDE_ENV_FILE: /etc/dind-bridge/env.sh
      # A dummy that the proxy replaces with the real credential. Claude gets
      # its own dummy from apiKeyHelper in managed-settings.json.
      GH_TOKEN: managed-by-proxy
    volumes:
      - ../..:/workspace
      - public-ca:/public-ca:ro
      - dind-run:/var/run/dind:ro
    networks:
      proxy-internal:
        ipv4_address: 10.231.70.20
      dind-internal:
        ipv4_address: 10.231.71.20
    depends_on:
      proxy:
        condition: service_healthy
      dind:
        condition: service_started
  proxy:
    build:
      context: proxy
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    tmpfs:
      - /run/proxy-credentials:uid=1000,gid=1000,mode=0700,size=1m
    volumes:
      - proxy-private-ca:/home/mitmproxy/.mitmproxy
      - public-ca:/public-ca
    networks:
      proxy-internal:
        ipv4_address: 10.231.70.10
      proxy-external: {}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
  dind:
    image: docker:dind-rootless@sha256:8a213afdd096a44dff403aaf8eb58b7a96a63113f18a4b094b98b7d0ed7d948b
    privileged: true
    # Nothing in DinD needs to reach out. As root, allow only loopback and
    # replies, which also keeps nested containers off the host through the
    # network gateway; then run rootless dockerd as UID 1000.
    user: "0:0"
    entrypoint:
      - sh
      - -euc
      - |
        ip6tables -P OUTPUT DROP
        ip6tables -A OUTPUT -o lo -j ACCEPT
        iptables -P OUTPUT DROP
        # Docker's embedded resolver forwards to the host's resolver.
        iptables -A OUTPUT -d 127.0.0.11 -j DROP
        iptables -A OUTPUT -o lo -j ACCEPT
        iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        # The image's setpriv is BusyBox's, which cannot change user; su also sets HOME.
        exec su -s /bin/sh -c 'exec dockerd-entrypoint.sh dockerd --host=unix:///run/user/1000/docker.sock' rootless
    environment:
      DOCKER_TLS_CERTDIR: ""
      # rootlesskit, not tini, is PID 1, so tini must register as a subreaper.
      TINI_SUBREAPER: "1"
    volumes:
      - dind-run:/run/user/1000
      - dind-data:/home/rootless/.local/share/docker
    networks:
      dind-internal:
        ipv4_address: 10.231.71.10

networks:
  # Internal networks still give the host an address on each bridge. The agent
  # and DinD firewalls, not the network, keep containers off the host.
  proxy-internal:
    internal: true
    enable_ipv6: false
    ipam:
      config: [{subnet: 10.231.70.0/24}]
  dind-internal:
    internal: true
    enable_ipv6: false
    ipam:
      config: [{subnet: 10.231.71.0/24}]
  proxy-external:
    enable_ipv6: false

volumes:
  public-ca:
  proxy-private-ca:
  dind-data:
  dind-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0700

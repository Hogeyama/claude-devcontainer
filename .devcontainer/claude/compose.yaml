# Distributed core. Include it from .devcontainer/compose.yaml and extend there;
# paths here assume this directory is .devcontainer/claude in the workspace.
#
# The variables below come from .devcontainer/.generated/settings.env, which
# initializeCommand writes from .devcontainer/claude.toml and claude.local.toml
# (scripts/settings.py describes them and the names); never set them otherwise.
# Optional services use a scale of 0 or 1. Conditional mounts are written
# to .generated/workspace.compose.yaml by scripts/settings.py.
services:
  agent:
    labels:
      dev.claude-devcontainer.git-isolation: ${CLAUDE_DEVCONTAINER_GIT_ISOLATION:-clone}
    build:
      context: .
      dockerfile: agent/Dockerfile
      # The workspace's .devcontainer/, for its optional agent-setup.sh; in
      # host mode, the host command's state directory (scripts/layout.py).
      additional_contexts:
        workspace-config: ${CLAUDE_DEVCONTAINER_CONFIG_DIR:-..}
      args:
        AGENT_UID: ${CLAUDE_DEVCONTAINER_UID:-1000}
        AGENT_GID: ${CLAUDE_DEVCONTAINER_GID:-1000}
        INSTALL_CODE_SERVER: ${CLAUDE_DEVCONTAINER_CODE_SERVER:-0}
        CODE_SERVER_EXTENSIONS: ${CLAUDE_DEVCONTAINER_CODE_SERVER_EXTENSIONS:-}
        INSTALL_ACP: ${CLAUDE_DEVCONTAINER_ACP:-0}
        ACP_VERSION: ${CLAUDE_DEVCONTAINER_ACP_VERSION:-0.90.0}
    command: ["sleep", "infinity"]
    # sleep as PID 1 reaps nothing, so processes orphaned by devcontainer exec
    # sessions would otherwise stay as zombies.
    init: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges=true
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
      # Lets code-server-proxy's connections be forwarded to loopback
      # (agent/init-firewall.sh), with the isolated editor only.
      net.ipv4.conf.all.route_localnet: ${CLAUDE_DEVCONTAINER_CODE_SERVER:-0}
    # Names for the proxy and DinD, in /etc/hosts since the firewall drops DNS.
    # The workspace's compose.yaml cannot read the subnets, which only this
    # file gets (include's env_file), so it names them instead.
    extra_hosts:
      - claude-proxy:${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.10
      - claude-dind:${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.10
    environment:
      CLAUDE_DEVCONTAINER_GIT_ISOLATION: ${CLAUDE_DEVCONTAINER_GIT_ISOLATION:-clone}
      # The entrypoint's firewall allows only these two.
      CLAUDE_DEVCONTAINER_PROXY_ADDRESS: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.10
      CLAUDE_DEVCONTAINER_DIND_ADDRESS: ${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.10
      HTTP_PROXY: http://claude-proxy:8080
      HTTPS_PROXY: http://claude-proxy:8080
      http_proxy: http://claude-proxy:8080
      https_proxy: http://claude-proxy:8080
      NO_PROXY: localhost,127.0.0.1,::1,${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.10
      no_proxy: localhost,127.0.0.1,::1,${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.10
      DOCKER_HOST: tcp://127.0.0.1:2375
      TESTCONTAINERS_HOST_OVERRIDE: 127.0.0.1
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /run/user/${CLAUDE_DEVCONTAINER_UID:-1000}/docker.sock
      CLAUDE_DEVCONTAINER_DIND: ${CLAUDE_DEVCONTAINER_DIND:-0}
      CLAUDE_DEVCONTAINER_CODE_SERVER: ${CLAUDE_DEVCONTAINER_CODE_SERVER:-0}
      CLAUDE_DEVCONTAINER_CODE_SERVER_PROXY_ADDRESS: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.30
      CLAUDE_DEVCONTAINER_NIX: ${CLAUDE_DEVCONTAINER_NIX:-0}
      CLAUDE_DEVCONTAINER_SUMI: ${CLAUDE_DEVCONTAINER_SUMI:-0}
      # A dummy that the proxy replaces with the real credential. Claude takes
      # an OAuth token, not an API key, so that it counts as a claude.ai login
      # and offers Artifacts.
      CLAUDE_CODE_OAUTH_TOKEN: managed-by-proxy
    # The workspace's own dummies, such as GH_TOKEN: env of each host in
    # proxy.hosts of claude.toml.
    env_file:
      - path: ${CLAUDE_DEVCONTAINER_CONFIG_DIR:-..}/.generated/agent.env
        required: false
    volumes:
      - workspace:/workspace
      - {type: bind, source: "${CLAUDE_DEVCONTAINER_CONFIG_DIR:-..}/.generated", target: /run/host/generated, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${CLAUDE_DEVCONTAINER_CONFIG_DIR:-..}/.nix-env", target: /run/host/nix-env, read_only: true, bind: {create_host_path: false}}
      - public-ca:/public-ca:ro
      - dind-run:/var/run/dind:ro
      # Read-only, so that the agent cannot swap the broker's socket for its own.
      - sumi-run:/run/sumi:ro
      # Session history, kept across container rebuilds for `claude --resume`.
      - claude-projects:/home/node/.claude/projects
      # The isolated editor's server data: the user settings, Machine
      # settings and the state of its extensions. The editor window keeps
      # only its own layout and open editors.
      - vscode-server-data:/home/node/.vscode-server
    # Markers of the host's startup work, which wait-ready.sh waits for. A
    # restart clears them, so a stale one cannot end the wait early.
    tmpfs:
      - /run/claude-devcontainer:uid=${CLAUDE_DEVCONTAINER_UID:-1000},gid=${CLAUDE_DEVCONTAINER_GID:-1000},mode=0700,size=1m
      # Root's, and sticky like /tmp: Claude Code creates and replaces its own
      # files here, but cannot change or move the root-owned copies of the
      # host's configuration (scripts/copy-host-config.py). Being a mount
      # point, it cannot be moved aside as a whole either. exec, since
      # Docker mounts a tmpfs noexec by default and the copied skills carry
      # scripts that Claude Code runs from here.
      - /home/node/.claude:mode=1777,exec
    networks:
      proxy-internal:
        ipv4_address: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.20
      dind-internal:
        ipv4_address: ${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.20
    depends_on:
      code-server-proxy:
        condition: service_started
        required: false
      proxy:
        condition: service_healthy
      dind:
        condition: service_started
        # Absent unless CLAUDE_DEVCONTAINER_DIND=1.
        required: false
      sumi:
        condition: service_started
        # Absent unless sumi.enabled.
        required: false
  code-server-proxy:
    pull_policy: build
    scale: ${CLAUDE_DEVCONTAINER_CODE_SERVER:-0}
    # Like the agent's: mitmdump as PID 1 would reap no orphans.
    init: true
    build:
      context: code-server
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    tmpfs: ["/home/mitmproxy/.mitmproxy:uid=1000,gid=1000,mode=0700"]
    # A free port of the range, so that several workspaces can be up at once;
    # code-server.sh asks compose which.
    ports: ["127.0.0.1:18086-18186:8080"]
    extra_hosts:
      - agent-code-server:${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.20
    networks:
      proxy-internal:
        ipv4_address: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.30
      code-server-ingress: {}
  proxy:
    # Build on every `up`: `devcontainer build` builds only the agent, and the
    # policy (addon.py, the workspace's .generated/proxy.json) would otherwise
    # stay as first built. The cache makes an unchanged build quick.
    pull_policy: build
    build:
      context: proxy
      # The workspace's .devcontainer/, for its .generated/proxy.json.
      additional_contexts:
        workspace-config: ${CLAUDE_DEVCONTAINER_CONFIG_DIR:-..}
    mem_limit: 512m
    # Like the agent's: mitmdump as PID 1 would reap no orphans.
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    environment:
      CLAUDE_DEVCONTAINER_CONNECTORS: ${CLAUDE_DEVCONTAINER_CONNECTORS:-}
      CLAUDE_DEVCONTAINER_WEB_SEARCH: ${CLAUDE_DEVCONTAINER_WEB_SEARCH:-0}
    tmpfs:
      - /run/proxy-credentials:uid=1000,gid=1000,mode=0700,size=1m
    volumes:
      - proxy-private-ca:/home/mitmproxy/.mitmproxy
      - public-ca:/public-ca
      # features/no-proxy-ca.pem is empty.
      - type: bind
        source: ${CLAUDE_DEVCONTAINER_PROXY_CA:-./features/no-proxy-ca.pem}
        target: /run/proxy-ca/ca.pem
        read_only: true
        bind: {create_host_path: false}
    networks:
      proxy-internal:
        ipv4_address: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.10
      proxy-external: {}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
  dind:
    scale: ${CLAUDE_DEVCONTAINER_DIND:-0}
    # docker.shared_base, by which dind-base.py finds the DinDs over a base.
    labels:
      dev.claude-devcontainer.dind-base: ${CLAUDE_DEVCONTAINER_DIND_SHARED:-}
    build:
      context: dind
      args:
        ROOTLESS_UID: ${CLAUDE_DEVCONTAINER_UID:-1000}
        ROOTLESS_GID: ${CLAUDE_DEVCONTAINER_GID:-1000}
    privileged: true
    # rootlesskit would be PID 1, which reaps no orphans.
    init: true
    # Nothing in DinD needs to reach out. As root, allow only loopback and
    # replies, which also keeps nested containers off the host through the
    # network gateway; then run rootless dockerd as the agent's UID.
    user: "0:0"
    entrypoint:
      - sh
      - -euc
      - |
        ip6tables -P OUTPUT DROP
        ip6tables -A OUTPUT -o lo -j ACCEPT
        iptables -P OUTPUT DROP
        # Docker's embedded resolver forwards to the host's resolver.
        iptables -A OUTPUT -d 127.0.0.11 -j DROP
        iptables -A OUTPUT -o lo -j ACCEPT
        iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        # The image's setpriv is BusyBox's, which cannot change user; su also sets HOME.
        # Over a shared base, the data is on an overlay, where the kernel's
        # overlay cannot keep upper directories: use fuse-overlayfs, as
        # scripts/dind-base.py does for the base.
        exec su -s /bin/sh -c 'exec dockerd-entrypoint.sh dockerd --host=unix:///run/user/${CLAUDE_DEVCONTAINER_UID:-1000}/docker.sock ${CLAUDE_DEVCONTAINER_DIND_SHARED:+--storage-driver=fuse-overlayfs --feature=containerd-snapshotter=false}' rootless
    environment:
      DOCKER_TLS_CERTDIR: ""
      # The image's tini is not PID 1, so it must register as a subreaper.
      TINI_SUBREAPER: "1"
    volumes:
      - dind-run:/run/user/${CLAUDE_DEVCONTAINER_UID:-1000}
      - dind-data:/home/rootless/.local/share/docker
    networks:
      dind-internal:
        ipv4_address: ${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.10

  # The mask broker. It alone reads the secrets; the agent's hooks and Bash ask
  # it through the socket (agent/Dockerfile writes those hooks).
  sumi:
    scale: ${CLAUDE_DEVCONTAINER_SUMI:-0}
    build:
      context: .
      dockerfile: agent/Dockerfile
      target: sumi-serve
      additional_contexts:
        workspace-config: ${CLAUDE_DEVCONTAINER_CONFIG_DIR:-..}
    # The owner of the secrets file, which must be 0600; and of the socket,
    # which the agent connects to.
    user: ${CLAUDE_DEVCONTAINER_UID:-1000}:${CLAUDE_DEVCONTAINER_GID:-1000}
    command: [--secrets-file, "/secrets/${CLAUDE_DEVCONTAINER_SUMI_FILE:-secrets.txt}", --listen, /run/sumi/mask.sock]
    network_mode: none
    # sumi as PID 1 would reap no orphans.
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges=true]
    volumes:
      # The directory, not the file: an editor that replaces the file on save
      # would leave a file mount on the old content.
      - type: bind
        source: ${CLAUDE_DEVCONTAINER_SUMI_DIR:-${HOME}/.config/claude-devcontainer/sumi}
        target: /secrets
        read_only: true
        bind: {create_host_path: false}
      - sumi-run:/run/sumi

networks:
  # Internal networks still give the host an address on each bridge. The agent
  # and DinD firewalls, not the network, keep containers off the host.
  proxy-internal:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${CLAUDE_DEVCONTAINER_PROXY_NET:-10.231.70}.0/24
  dind-internal:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: ${CLAUDE_DEVCONTAINER_DIND_NET:-10.231.71}.0/24
  code-server-ingress:
    enable_ipv6: false
  proxy-external:
    enable_ipv6: false

volumes:
  workspace:
  # The agent's Git in shared mode, under the host's working tree.
  agent-git:
  claude-projects:
  vscode-server-data:
  public-ca:
  proxy-private-ca:
  dind-data:
  dind-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=${CLAUDE_DEVCONTAINER_UID:-1000},gid=${CLAUDE_DEVCONTAINER_GID:-1000},mode=0700
  sumi-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=${CLAUDE_DEVCONTAINER_UID:-1000},gid=${CLAUDE_DEVCONTAINER_GID:-1000},mode=0700

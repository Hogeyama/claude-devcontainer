# The host command's environment (scripts/claude-devcontainer), for a
# repository without .devcontainer: the state directory that the command names
# stands in for .devcontainer/. Every repository uses this one file, so the
# project is named after the workspace.
name: cdc-${CLAUDE_DEVCONTAINER_WORKSPACE_ID:?run claude-devcontainer}
include:
  - path:
      - ../compose.yaml
      - ${CLAUDE_DEVCONTAINER_CONFIG_DIR:?run claude-devcontainer}/.generated/workspace.compose.yaml
    env_file:
      - ${CLAUDE_DEVCONTAINER_CONFIG_DIR:?run claude-devcontainer}/.generated/networks.env
      - ${CLAUDE_DEVCONTAINER_CONFIG_DIR:?run claude-devcontainer}/.generated/settings.env

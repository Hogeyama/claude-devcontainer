# Owned by this workspace. The core in claude/ is updated with git subtree;
# extend it here instead of editing it. Relative paths below are from
# .devcontainer/.
include:
  - path: claude/compose.yaml
    # The workspace's settings. .env, if present, overrides them for this host.
    env_file: [claude.env]

services:
  agent:
    environment:
      # Dummies for the tokens that proxy.yaml injects, so that tools send
      # requests at all; the proxy replaces them.
      GH_TOKEN: managed-by-proxy
